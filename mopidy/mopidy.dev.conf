[core]
cache_dir = /var/cache/mopidy
data_dir = /var/lib/mopidy

[audio]
# Keep real-time playback/position tracking, but do not require a host sound device.
output = audioconvert ! audioresample ! fakesink sync=true

[http]
enabled = true
hostname = 0.0.0.0
port = 6680
allowed_origins = localhost:3000,127.0.0.1:3000,localhost:3001,127.0.0.1:3001,backend:3001

[local]
enabled = true
media_dir = /media/music

[file]
enabled = true
media_dirs = /media/music

[m3u]
enabled = true
