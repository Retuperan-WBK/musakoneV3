[package]
name = "musakone-tui"
version = "0.1.0"
edition = "2021"
description = "ncmpcpp-style terminal client for the MusakoneV3 backend"

[[bin]]
name = "musakone"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
fontdue = { version = "0.9", default-features = false, features = ["std"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
